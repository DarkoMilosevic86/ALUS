	toggleDelayedCharacterDescriptions = not written
	toggleSimpleReviewMode = not written
	activateAddonStoreSettings = the other screen reader's add-on store; ALUS add-ons are installed by hand
	activateAddonsManager = the other screen reader's add-on store; ALUS add-ons are installed by hand
