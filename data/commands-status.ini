; Commands that are in v1.0 scope and that ALUS does not implement yet.
;
; THIS FILE IS NOT GENERATED. data/scripts.csv and data/gestures-builtin.ini
; are both written by tools/extract-commands.py out of upstream's source, so
; they say what a command IS and which key runs it -- never whether ALUS has
; written it. That is this file's job, and it is maintained by hand.
;
; WHY IT EXISTS. `quit` was in scripts.csv with `kb:ALUS+q`, docs/commands.md
; promised it, and pressing it did nothing whatsoever (docs/history/phase-9.md N99).
; T9.5 could not see that, because it compares the reference with the
; catalogue and the reference is generated FROM the catalogue -- two copies of
; one truth, agreeing about a command that did not exist. So this is the third
; source, and it is load-bearing in two places at once:
;
;   * at run time, every command listed under [announce] is bound to an
;     announcement, so the key SAYS it is not in this version instead of
;     being silent. An unfinished feature a user can hear is a different
;     thing from a broken one (docs/history/phase-6.md O10).
;   * in the tests, tests/coverage/test_command_coverage.cpp asserts that
;     every key the built-in map assigns either runs a real command or is
;     listed here -- and that nothing listed here is secretly implemented
;     already. The list can only shrink.
;
; To implement one of these: write it, remove its line here, and the test
; will tell you if you got the wiring wrong.

; Not written yet. The key is grabbed and announces that the command is not in
; this version. The value is the reason, for the reader of this file.
[announce]
	activatePythonConsole = ALUS has no embedded interpreter; v1.1 at the earliest
	cycleAudioDuckingMode = ALUS does not duck other applications' audio; there is no ducking to cycle
	cycleSoundSplit = sound split is a v1.1 audio feature
	moveMouseToNavigatorObject = ALUS cannot move the pointer on Wayland (N18)
	moveNavigatorObjectToMouse = no mouse tracking; see toggleMouseTracking
	reloadPlugins = plugins load once at start-up; reloading them is phase 8 work that was not done
	test_navigatorDisplayModelText = a developer command for the screen model, which ALUS has none of
	toggleLeftMouseButton = ALUS cannot hold a mouse button down on Wayland (N18)
	toggleMouseTracking = ALUS does not follow the pointer at all; v1.1
	toggleNativeAppSelectionMode = native selection needs the application to own the selection; not written
	toggleRightMouseButton = ALUS cannot hold a mouse button down on Wayland (N18)

; CANNOT be implemented on this platform, and must therefore NOT be grabbed:
; the key belongs to the application, and ALUS has no way to give it back
; (N18 -- no key injection on Wayland). Announcing on these would be worse
; than silence, because the user would lose the key and gain a sentence. The
; test asserts that these stay unbound, so that nobody "fixes" them by
; grabbing them.
[platform]
	passThrough = its whole purpose is to send the key to the application, which is exactly what N18 forbids
	shiftTab = shift+tab must reach the application; ALUS cannot re-send it
	tab = tab must reach the application; ALUS cannot re-send it

; N154: commands the catalogue carries (it is extracted from upstream) that
; ALUS does not have AND that have no key, so nothing is grabbed or spoken for
; them. They are HIDDEN from the Input gestures dialog and from the commands
; quick reference: those list what ALUS can do, and a row for the other
; screen reader's add-on store or wxPython inspector is a promise ALUS does
; not keep. The test asserts both ways: every command nothing implements is
; listed somewhere in this file, and nothing listed here is implemented. To
; implement one, write it and delete its line.
[missing]
	mouseScrollDown = Wayland gives a screen reader no pointer position
	mouseScrollLeft = Wayland gives a screen reader no pointer position
	mouseScrollRight = Wayland gives a screen reader no pointer position
	mouseScrollUp = Wayland gives a screen reader no pointer position
	toggleMouseAudioCoordinates = Wayland gives a screen reader no pointer position
	toggleMouseTextResolution = Wayland gives a screen reader no pointer position
	activatePrivacyAndSecuritySettings = a settings panel ALUS does not have
	startWxInspectionTool = a tool of the other screen reader's wxPython windows; ALUS has none
	activateLongDesc = browse mode has no such element search yet
	nextDifferentStyle = browse mode has no such element search yet
	nextReference = browse mode has no such element search yet
	nextSameStyle = browse mode has no such element search yet
	nextSelectedElement = browse mode has no such element search yet
	nextVerticalParagraph = browse mode has no such element search yet
	prevSelectedElement = browse mode has no such element search yet
	previousDifferentStyle = browse mode has no such element search yet
	previousReference = browse mode has no such element search yet
	previousSameStyle = browse mode has no such element search yet
	previousVerticalParagraph = browse mode has no such element search yet
	trapNonCommandGesture = browse mode has no such element search yet
	activateInputCompositionDialog = input method composition is the desktop's on Linux
	caret_changeSelection = internal to the other screen reader; no description, never shown
	caret_newLine = internal to the other screen reader; no description, never shown
	activateDefaultDictionaryDialog = no dialog yet; the dictionaries are edited as files in the configuration folder
	activateSpeechSymbolsDialog = no dialog yet; the dictionaries are edited as files in the configuration folder
	activateTemporaryDictionaryDialog = no dialog yet; the dictionaries are edited as files in the configuration folder
	activateVoiceDictionaryDialog = no dialog yet; the dictionaries are edited as files in the configuration folder
	toggleReportCLDR = no toggle key yet; set it in the settings window, Document formatting
	reportLinkDestinationInWindow = not written
	reviewCursorToStatusLine = not written
	review_currentSymbol = not written
