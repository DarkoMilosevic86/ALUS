; ALUS's own key assignments, where they differ from upstream's.
;
; THIS FILE IS NOT GENERATED, and it is the only input to the generated
; gesture map that is not upstream's source. tools/extract-commands.py applies
; it when it writes data/gestures-builtin.ini and data/scripts.csv, so there
; stays exactly ONE built-in map, ONE grab set and ONE command reference --
; and no priority puzzle about which layer wins.
;
; WHY NOT A NEW MAP LAYER. The layers are user > locale > braille driver >
; built-in, and they OVERLAY rather than replace: a layer that bound a command
; to a new key would leave the old key bound as well, so both would work and
; the reference would name the wrong one. Changing the generated map's input
; is the only way to actually MOVE a key.
;
; WHY NOT EDIT data/gestures-builtin.ini. It is regenerated from the upstream
; checkout, and an edit there is lost the next time anyone runs the extractor
; -- silently, because nothing would fail.
;
; An entry here REPLACES upstream's whole gesture list for that command. To
; leave a command with no key at all, give it an empty value.
;
; Every line needs a reason, in a comment: a key that differs from the screen
; reader users moved from costs them something (H1), so it has to be worth it.

[globalCommands.GlobalCommands]
	; Upstream opens its menu with <reader>+n. ALUS has no menu -- the key
	; opens the settings window (src/gui/service.cpp) -- and `a` is easiest
	; to remember: `a` for ALUS.
	;
	; DESKTOP ONLY, and that is measured rather than chosen: in the laptop
	; layout upstream already binds ALUS+a to sayAll, and two commands on one
	; key is decided by whichever command object step 10 reaches first --
	; which is not a behaviour anybody chose. So the laptop layout keeps
	; upstream's ALUS+n, which nothing there uses (its only other `n` is
	; ALUS+shift+n).
	showGui = kb(desktop):ALUS+a, kb(laptop):ALUS+n
